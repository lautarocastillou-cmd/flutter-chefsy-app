name: Shorebird Base Release (APK)

on:
  workflow_dispatch:

jobs:
  release-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Generate local.properties for Android SDK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$(dirname $(dirname $(which flutter)))" >> android/local.properties
          cat android/local.properties

      - name: Get Dependencies
        run: |
          chmod +x android/gradlew
          flutter pub get

      - name: Verificar build Flutter (diagnóstico)
        run: |
          flutter build apk --release --verbose 2>&1 | tail -100
        continue-on-error: true

      - name: Shorebird Init (Crear app en la nube si no existe)
        run: |
          if [ ! -f shorebird.yaml ]; then
            shorebird init --force
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add shorebird.yaml
            git commit -m "chore: auto-generate shorebird.yaml via CI"
            git push
          fi
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: Compilar APK Base con Shorebird
        run: |
          shorebird release android --artifact=apk --flutter-version=3.29.0
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: Localizar y normalizar APK generado
        run: |
          mkdir -p build/app/outputs/flutter-apk
          APK_FOUND=$(find build -type f -name "*.apk" | grep -v "intermediate" | head -n 1)
          if [ -n "$APK_FOUND" ]; then
            echo "APK encontrado en: $APK_FOUND"
            cp "$APK_FOUND" build/app/outputs/flutter-apk/app-release.apk
          else
            echo "No se encontró APK en build/. Verificando archivos generados:"
            find build -type f
          fi
          ls -lh build/app/outputs/flutter-apk/app-release.apk || true

      - name: Subir APK para Descargar (Artifact de GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-base-shorebird
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn

      - name: Publicar GitHub Release con la última APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "Chefsy Cadete App (Última versión APK)"
          body: "APK oficial de Cadetería compilada automáticamente por GitHub Actions con Shorebird."
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Subir APK a Servidores Públicos de Chefsy (Supabase Storage)
        run: |
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "Subiendo APK a Supabase Storage via API de Chefsy..."
            curl -f -X POST "https://chefsy.app/api/cadeteria/subir-apk" \
              -H "Authorization: Bearer ${{ secrets.FLUTTER_SECRET_TOKEN || 'chefsy-flutter-secret-2026' }}" \
              -F "file=@build/app/outputs/flutter-apk/app-release.apk" || echo "Aviso: No se pudo conectar con el endpoint de subida (puede requerir despliegue web)."
          fi
