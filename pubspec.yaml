name: chefsy_cadete
description: Portal móvil y servicio nativo de rastreo GPS en segundo plano para cadetes de Chefsy.
publish_to: 'none'
version: 1.0.3+6

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_foreground_task: ^8.17.0
  geolocator: ^13.0.1
  http: ^1.2.2
  package_info_plus: ^10.2.1
  shared_preferences: ^2.3.2
  shorebird_code_push: ^2.0.7
  supabase_flutter: ^2.8.0
  url_launcher: ^6.3.1
  restart_app: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - shorebird.yaml
    - assets/logo.png
